:root{--bgL:#f6f0dc;--bgD:#10303a;--acL:#8a5a00;--acD:#e8c35a;--fgL:#1e2a26;--fgD:#f6efd6;--bg:var(--bgL);--fg:var(--fgL);--ac:var(--acL);--card:rgba(255,255,255,.8);--ok:#1d8a4d;--no:#c0392b;--line:rgba(0,0,0,.2);--fill:rgba(0,0,0,.05);--sh:0 8px 24px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.o{display:block;width:100%;text-align:start;font:inherit;color:var(--fg);background:var(--fill);border:2px solid var(--line);border-radius:1rem;padding:.3rem 1rem;margin:.35rem 0;cursor:pointer}

.ch h3{margin:1rem 0 .3rem;font-size:1.2rem;color:var(--ac)}
.pt{padding-inline-start:1.4rem;margin:.4rem 0}.pt li{margin:.4rem 0}
.soon{display:inline-block;font-family:"Reem Kufi",serif;font-size:.95rem;background:var(--ac);color:var(--bg);border-radius:2rem;padding:0 .8rem;margin-inline-start:.6rem;vertical-align:middle}
.cs{text-align:center;padding:2.2rem 1.4rem}.cs .ct{font-size:2.2rem;color:var(--ac);animation:pl 2.6s ease-in-out infinite}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem}

.btn{display:inline-block;background:var(--ac);color:var(--bg);padding:.25rem 1.3rem;border-radius:2rem;text-decoration:none;font-family:"Reem Kufi",serif;font-weight:700}
.res{font-size:1.4rem;font-weight:700;color:var(--ac);margin:1rem 0}
summary{cursor:pointer;color:var(--ac);font-weight:700}
.sub a{color:var(--ac)}
@media (prefers-reduced-motion:reduce){.au{margin:.2rem 0 .6rem;opacity:.85;font-size:1rem}
audio{width:100%;margin:.4rem 0}
.ph{font-family:"Reem Kufi",serif;color:var(--ac);margin:1.6rem 0 .4rem}
.up{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem;counter-reset:u 3}
.up li{counter-increment:u;background:var(--card);border-radius:1rem;padding:.2rem 1rem;opacity:.8;border-inline-start:6px solid var(--line)}
.up li::before{content:counter(u) ". ";font-weight:700;color:var(--ac)}

<script>
var B={
ajr:{t:"الآجرومية",s:"متن ابن آجُرُّوم في مبادئ علم النحو",ch:[
{t:"الكلام وأقسامه",m:"الكلام هو اللفظ المركّب المفيد بالوضع، وأقسامه ثلاثة: اسم، وفعل، وحرف جاء لمعنى.",
e:["<b>اللفظ</b>: الصوت المشتمل على بعض الحروف، مثل «زيد». فالإشارة والكتابة ليستا لفظاً.","<b>المركّب</b>: ما تألّف من كلمتين فأكثر، مثل «قامَ زيدٌ». وكلمة «زيد» وحدها ليست مركّبة.","<b>المفيد</b>: ما يحسن السكوت عليه فيفهم السامع معنىً تاماً، مثل «الحقُّ واضحٌ». أما «إذا جاءَ زيدٌ» فالسامع ينتظر تمام الكلام.","<b>بالوضع</b>: أي باللغة العربية التي وضعها العرب؛ فالكلام بغير العربية لا يسمّى كلاماً في اصطلاح النحاة.","فإذا اجتمعت هذه الشروط سُمّي كلاماً، وأنواع الكلمة ثلاثة: اسم وفعل وحرف."],
x:[["قامَ زيدٌ","كلام: لفظ مركّب مفيد"],["زيدٌ","ليس كلاماً: كلمة مفردة"],["إذا جاءَ زيدٌ","ليس كلاماً: لا يحسن السكوت عليه"]]},
{t:"علامات الاسم والفعل والحرف",m:"فالاسم يُعرف بالخفض، والتنوين، ودخول الألف واللام، وحروف الخفض؛ والفعل يُعرف بقد، والسين، وسوف، وتاء التأنيث الساكنة؛ والحرف ما لا يصلح معه دليل الاسم ولا دليل الفعل.",
e:["<b>الاسم</b> كلمة تدل على معنىً في نفسها دون زمن. من علاماته: الخفض (مررتُ بزيدٍ)، والتنوين (رجلٌ)، و«ال» (الكتابُ)، وحروف الخفض.","حروف الخفض: من، إلى، عن، على، في، رُبَّ، الباء، الكاف، اللام. وحروف القسم: الواو والباء والتاء.","<b>الفعل</b> كلمة تدل على حدث مرتبط بزمن. من علاماته: «قد» (قد قامَ)، والسين (سيقومُ)، وسوف (سوف يقومُ)، وتاء التأنيث الساكنة (قامَتْ).","<b>الحرف</b> لا يظهر معناه وحده، وإنما مع غيره، ولا يقبل علامة الاسم ولا علامة الفعل، مثل «هل» و«لم» و«لن»."],
x:[["الكتابُ مفيدٌ","الكتابُ: اسم (ال)، مفيدٌ: اسم (تنوين)"],["قد نجحَ","نجحَ: فعل (دخلت عليه قد)"],["سيذهبُ","يذهبُ: فعل (دخلت عليه السين)"],["كتبَتْ","كتبَ: فعل (تاء التأنيث الساكنة)"],["هل جاءَ","هل: حرف استفهام"]]},
{t:"الإعراب",m:"الإعراب هو تغيير أواخر الكلم لاختلاف العوامل الداخلة عليها لفظاً أو تقديراً، وأقسامه أربعة: رفع، ونصب، وخفض، وجزم. فللأسماء من ذلك الرفع والنصب والخفض ولا جزم فيها، وللأفعال من ذلك الرفع والنصب والجزم ولا خفض فيها.",
e:["الإعراب أن يتغيّر آخر الكلمة بحسب موقعها في الجملة: «جاءَ زيدٌ»، «رأيتُ زيداً»، «مررتُ بزيدٍ»؛ فتغيّر آخر «زيد» بين الضمة والفتحة والكسرة.","<b>العوامل</b>: الكلمات التي تُحدث هذا التغيير، كالفعل (جاءَ، رأيتُ) وحرف الجر (الباء).","<b>لفظاً</b>: أن تظهر العلامة على آخر الكلمة (جاءَ زيدٌ). <b>تقديراً</b>: أن تكون العلامة منويّة لتعذّر ظهورها (جاءَ الفتى: الضمة مقدّرة على الألف).","الأسماء تُرفع وتُنصب وتُخفض ولا تُجزم، والأفعال المضارعة تُرفع وتُنصب وتُجزم ولا تُخفض."],
x:[["جاءَ زيدٌ","زيدٌ: مرفوع بالضمة"],["رأيتُ زيداً","زيداً: منصوب بالفتحة"],["مررتُ بزيدٍ","زيدٍ: مخفوض بالكسرة"],["لم يكتبْ","يكتبْ: مجزوم بالسكون"]]},
{t:"علامات الرفع",m:"للرفع أربع علامات: الضمة، والواو، والألف، والنون.",
e:["<b>الضمة</b> في أربعة مواضع: الاسم المفرد، وجمع التكسير، وجمع المؤنث السالم، والفعل المضارع الذي لم يتصل بآخره شيء.","<b>الواو</b> في موضعين: جمع المذكر السالم، والأسماء الخمسة: أبوك، أخوك، حموك، فوك، ذو مال.","<b>الألف</b> في المثنّى من الأسماء خاصة.","<b>النون</b> في الفعل المضارع إذا اتصل به ألف الاثنين أو واو الجماعة أو ياء المخاطبة، وتسمّى الأفعال الخمسة."],
x:[["جاءَ محمدٌ","الضمة: اسم مفرد"],["جاءَ الرجالُ","الضمة: جمع تكسير"],["جاءَتِ المسلماتُ","الضمة: جمع مؤنث سالم"],["يكتبُ زيدٌ","يكتبُ: مضارع مرفوع بالضمة"],["جاءَ المسلمونَ","الواو: جمع مذكر سالم"],["جاءَ أبوكَ","الواو: من الأسماء الخمسة"],["جاءَ الرجلانِ","الألف: مثنّى"],["الطالبانِ يكتبانِ","النون: يكتبانِ من الأفعال الخمسة"]]},
{t:"علامات النصب والخفض والجزم",m:"وللنصب خمس علامات: الفتحة، والألف، والكسرة، والياء، وحذف النون. وللخفض ثلاث علامات: الكسرة، والياء، والفتحة. وللجزم علامتان: السكون، والحذف.",
e:["<b>النصب</b>: الفتحة (المفرد، جمع التكسير، المضارع المنصوب)، والألف (الأسماء الخمسة)، والكسرة (جمع المؤنث السالم)، والياء (المثنّى وجمع المذكر السالم)، وحذف النون (الأفعال الخمسة).","<b>الخفض</b>: الكسرة (المفرد المنصرف، جمع التكسير المنصرف، جمع المؤنث السالم)، والياء (الأسماء الخمسة، المثنّى، جمع المذكر السالم)، والفتحة (الاسم الذي لا ينصرف).","<b>الجزم</b>: السكون في المضارع الصحيح الآخر، والحذف في المضارع المعتلّ الآخر وفي الأفعال الخمسة (بحذف النون).","<b>قاعدة تعين على الحفظ</b>: الأصل في العلامات الحركات (ضمة، فتحة، كسرة)، وما عداها فروع تنوب عنها."],
x:[["لن يكتبَ زيدٌ","الفتحة: مضارع منصوب"],["رأيتُ أباكَ","الألف: من الأسماء الخمسة"],["رأيتُ المسلماتِ","الكسرة: جمع مؤنث سالم"],["رأيتُ الرجلينِ","الياء: مثنّى منصوب"],["لن يكتبوا","حذف النون: من الأفعال الخمسة"],["مررتُ بأبيكَ","الياء: من الأسماء الخمسة"],["مررتُ بأحمدَ","الفتحة: اسم لا ينصرف"],["لم يكتبْ","السكون: مضارع صحيح الآخر"],["لم يخشَ","الحذف: حذف حرف العلة"]]}]},
lam:{t:"لامية الأفعال",s:"لابن مالك في أبنية الأفعال وتصريفها",ch:[]}};

{q:"أقسام الكلام ثلاثة، وهي:",o:["اسم وفعل وحرف","اسم وفعل وجملة","فعل وحرف وفاعل"],a:0,e:"الكلام: اسم، وفعل، وحرف جاء لمعنى."},
{q:"كلمة «الكتابُ» اسم لأنها:",o:["دخلت عليها «ال»","دخلت عليها «قد»","اتصلت بها تاء التأنيث الساكنة"],a:0,e:"دخول الألف واللام من علامات الاسم."},
{q:"أيّ كلمة تقبل دخول «قد» أو السين عليها؟",o:["كتابٌ","يذهبُ","في"],a:1,e:"«قد يذهبُ» و«سيذهبُ»؛ فهما من علامات الفعل."},
